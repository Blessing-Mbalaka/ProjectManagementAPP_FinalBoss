<div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
  <div class="modal-dialog"><div class="modal-content">
    <form method="post" action="{% url form_url project_id %}">
      {% csrf_token %}<input type="hidden" name="return_to" value="{{ task_return_url }}">
      <div class="modal-header"><h5 class="modal-title" id="addTaskModalLabel">Add New Task</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <p><strong>Project:</strong> {{ kanban_task_project.name }}</p>
        {% if kanban_task_form.errors %}<div class="alert alert-danger" role="alert">Task not saved. Correct the details below; your entries have been kept.</div>{% endif %}
        {{ kanban_task_form.as_p }}
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Add Task</button></div>
    </form>
  </div></div>
</div>
{% if open_task_modal %}<script>document.addEventListener('DOMContentLoaded', () => { bootstrap.Modal.getOrCreateInstance(document.getElementById('addTaskModal')).show(); });</script>{% endif %}

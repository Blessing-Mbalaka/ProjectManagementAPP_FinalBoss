<div class="modal fade" id="editTaskModal{{ task.id }}" tabindex="-1" aria-labelledby="editTaskModalLabel{{ task.id }}" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="{% url 'staff_edit_task' task.id %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="editTaskModalLabel{{ task.id }}">Update Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="editTaskStatus{{ task.id }}" class="form-label">Status</label>
            <select name="status" id="editTaskStatus{{ task.id }}" class="form-select">
              <option value="todo" {% if task.status == "todo" %}selected{% endif %}>To Do</option>
              <option value="in_progress" {% if task.status == "in_progress" %}selected{% endif %}>In Progress</option>
              <option value="review" {% if task.status == "review" %}selected{% endif %}>Review</option>
              <option value="done" {% if task.status == "done" %}selected{% endif %}>Done</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="editComments{{ task.id }}" class="form-label">Comments</label>
            <textarea name="comments" id="editComments{{ task.id }}" class="form-control" rows="4" placeholder="Add a progress comment">{{ task.comments }}</textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Update</button>
        </div>
      </form>
    </div>
  </div>
</div>
